# How this vault writes things.
#
# Install to ~/.config/tconfig/notation.toml. It describes *your vault*, not either
# tool: which sections are not really task lists, how you mark a weekday, where the
# notes live. Both `tdiff` and `tcat` read it, and neither has to be installed for the
# other to work — which is the whole reason this folder belongs to neither of them.
#
# The companion file, statuses.toml, says what the statuses *mean*. The split is by
# concern rather than by tool, because that is the axis along which a file actually
# changes: you rewrite this one when you change how you write a note, and that one
# when you change what a status is for.
#
# Layers, lowest precedence first — each merges over the ones below, so a partial file
# never erases what a lower layer set:
#
#   1. ~/.config/tconfig/notation.toml    this file
#   2. ~/.config/tconfig/statuses.toml    the status vocabulary
#   3. ~/.config/tconfig/<tool>.toml      tdiff.toml / tcat.toml, optional overrides
#   4. $TDIFF_CONFIG / $TCAT_CONFIG
#   5. --config <path>
#
# Set $TCONFIG_DIR to put the folder somewhere else. Nothing is ever created for you.
# If tconfig/ holds none of these files, the pre-tconfig layout is read instead —
# ~/.config/obsidian-tasks/statuses.toml and ~/.config/<tool>/config.toml — with one
# notice naming this folder. That is a fallback for the first run after the move, not
# a layer: a tconfig/ that exists wins outright.


[exclude]
# Headings never read, at any level, along with everything under them. ">" separates
# ancestors, reading outward-in, and levels may sit between them: "archive" names that
# heading wherever it appears, "plan > deferred" only the one under a "plan" heading.
# A section runs until the next heading at the same or shallower level.
#
# Only headings. Bold text is not a section: it carries no level, so where one ends is
# a guess — two in a row are siblings, one meant to nest inside another is
# indistinguishable from one following it, and bolding a paragraph would grow a
# section by accident.
#
# Emphasis, backticks and case are formatting, not name: "*Old Notes*", "Old Notes"
# and "old notes" are all written here as bare lowercase words.
#
# Fenced code blocks are skipped whatever this says, so a task list frozen inside one
# needs no entry. This list is for the rest, and is the durable version of the same
# idea: a section is skipped for what it is called, not for how it happens to be
# formatted. --all ignores this list for one run, and does not lift the fence.
sections = []

# Tags whose task lines are never read. A tag is the other way a vault marks a line as
# not-really-a-task; naming them here is the same idea as naming a section, and the
# script has no opinion on which ones a vault uses. Matched with a word boundary at the
# end, so "#routine" does not also take "#routines" or "#routine/daily" — list those
# separately if that is what you mean. --all ignores this too.
tags = ["#routine"]


[days]
# How this vault writes each weekday marker, as a **literal** matched against the whole
# line (case-insensitive, surrounding whitespace stripped). The marker must be alone on
# the line: "**monday** day" is not a marker, and neither is a task or a comment that
# happens to mention a weekday.
#
# Nothing in a value is a wildcard. Asterisks, brackets and pipes mean themselves:
#
#   monday = "**monday**"              matches exactly that, alone on a line
#   monday = "#### monday"             matches a heading
#   monday = "*segunda*"               matches whatever you actually write
#
# `{date}` is the one exception, and stands for an ISO date (YYYY-MM-DD) — because a
# dated marker changes every week and cannot be a fixed string:
#
#   monday = "[[{date}|monday]]"       matches [[2026-08-24|monday]]
#
# A list gives a day several spellings, which is how a vault that has changed the
# notation keeps reading its own history:
#
#   monday = ["**monday**", "[[{date}|monday]]"]
#
# This is read for exactly one purpose: a week derived from a date stops strictly
# before that date, which means dropping tasks allocated to that day or later. Leave
# the section out and nothing ever opens a day, so a weekly note contributes all its
# tasks whatever the date — the daily notes still truncate, since their bound is the
# filename rather than anything inside them.
#
# Markers are looked for in **weekly notes only**. A daily note has its date in its
# filename and nothing inside it allocates a day, so reading markers there could only
# ever produce false ones.
sunday    = ["**sunday**",    "[[{date}|sunday]]"]
monday    = ["**monday**",    "[[{date}|monday]]"]
tuesday   = ["**tuesday**",   "[[{date}|tuesday]]"]
wednesday = ["**wednesday**", "[[{date}|wednesday]]"]
thursday  = ["**thursday**",  "[[{date}|thursday]]"]
friday    = ["**friday**",    "[[{date}|friday]]"]
saturday  = ["**saturday**",  "[[{date}|saturday]]"]


[comment]
# Characters that cut a trailing comment off a task name, so that
#
#   - [ ] do blood screening – will complete saturday or next week
#
# is the task `do blood screening`. The separator only counts when it stands alone
# between spaces AND outside every bracket and parenthesis, so a linked title keeps its
# own dashes: `check on [prompting best practices – anthropic](…)` stays whole.
#
# Name only what your vault actually uses as notation. Listing the ASCII hyphen "-"
# alongside the en dash is usually a mistake: a hyphen is what a keyboard produces in
# ordinary prose, and it will truncate names you meant to keep.
#
# Omit the section and nothing is ever stripped, which is the right answer for a vault
# that writes no comments.
separators = ["–"]


[vault]
# Optional. If set (non-empty), daily/weekly lookups are prefixed with this folder.
# If empty or omitted, files resolve by name anywhere in the vault — which is how
# `obsidian read file=` behaves natively, so leaving these empty is usually right.
daily_folder = ""
weekly_folder = ""
